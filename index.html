<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP INFRA | NEURAL INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --glow: #00ffcc; --admin: #ff0055; --bg: #000; --card: rgba(15, 15, 20, 0.95); --border: rgba(255,255,255,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit', sans-serif; }
        body { background: var(--bg); color:#fff; height:100vh; overflow:hidden; }
        
        /* Background & Layout */
        .app-frame { height:100vh; display:flex; flex-direction:column; background: radial-gradient(circle at center, #0a0c10 0%, #000 100%); }
        header { padding:20px 40px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.9); backdrop-filter:blur(15px); }
        .logo { font-weight:900; letter-spacing:3px; color:var(--glow); text-shadow:0 0 15px var(--glow); font-size:1.1rem; }

        .view { display:none; padding:40px; overflow-y:auto; flex:1; animation: fadeIn 0.5s ease; }
        .view.active { display:block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

        /* Login Interface */
        .login-screen { text-align:center; margin-top:12vh; }
        .login-screen h1 { font-size:5rem; font-weight:900; line-height:0.9; margin-bottom:15px; }
        .login-screen span { color:var(--glow); }

        /* Services Grid */
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:25px; }
        .service-card { background:var(--card); border:1px solid var(--border); border-radius:28px; padding:45px 25px; text-align:center; position:relative; transition:0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-decoration:none; color:white; display:block; }
        .service-card:hover { border-color:var(--glow); transform:translateY(-8px); box-shadow:0 15px 40px rgba(0,255,204,0.15); }
        .service-card .ico { font-size:55px; display:block; margin-bottom:20px; filter:drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
        
        /* Admin Interface */
        .admin-wrap { margin-top:60px; padding:40px; border-radius:35px; background:rgba(255, 0, 85, 0.04); border:1px solid rgba(255, 0, 85, 0.15); }
        .admin-tag { color:var(--admin); font-weight:900; font-size:12px; margin-bottom:25px; text-transform:uppercase; letter-spacing:4px; display:flex; align-items:center; gap:10px; }
        .admin-tag::before { content:''; width:8px; height:8px; background:var(--admin); border-radius:50%; box-shadow:0 0 10px var(--admin); }

        .form-box { display:flex; gap:15px; margin-bottom:25px; }
        input { flex:1; background:rgba(0,0,0,0.6); border:1px solid var(--border); padding:18px; border-radius:16px; color:white; outline:none; font-size:14px; transition:0.3s; }
        input:focus { border-color:var(--glow); background:rgba(0,0,0,0.8); }

        .btn { padding:18px 30px; border-radius:16px; border:none; font-weight:700; cursor:pointer; font-size:14px; transition:0.3s; }
        .btn-glow { background:var(--glow); color:#000; box-shadow:0 0 20px rgba(0,255,204,0.3); }
        .btn-admin { background:var(--admin); color:#fff; }
        .btn-del { position:absolute; top:15px; right:15px; background:rgba(255,255,255,0.05); border:none; color:#666; width:30px; height:30px; border-radius:50%; cursor:pointer; }
        .btn-del:hover { background:var(--admin); color:#fff; }

        /* Popups */
        #popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:1000; justify-content:center; align-items:center; }
        .popup-card { background:#111; border:2px solid var(--admin); padding:50px; border-radius:30px; text-align:center; max-width:450px; }
    </style>
</head>
<body>

    <div id="popup-overlay">
        <div class="popup-card">
            <h2 style="color:var(--admin); font-size:2rem; margin-bottom:15px;">ACCÈS BLOQUÉ</h2>
            <p id="err-text" style="opacity:0.7; line-height:1.6; margin-bottom:30px;"></p>
            <button class="btn btn-glow" onclick="closePopup()">RETOUR</button>
        </div>
    </div>

    <div class="app-frame">
        <header>
            <div class="logo">ROSA PARKS // CORE-INFRA</div>
            <div id="user-pill" style="font-size:10px; font-weight:bold; letter-spacing:1px; color:#444;">DISCONNECTED</div>
        </header>

        <div id="view-login" class="view active">
            <div class="login-screen">
                <h1>CORE<span>GATE</span></h1>
                <p style="color:#444; letter-spacing:5px; margin-bottom:40px; font-weight:300;">ENTER YOUR CAMPUS CREDENTIALS</p>
                <div style="display:flex; justify-content:center;">
                    <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="handleAuth"></div>
                    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
                </div>
            </div>
        </div>

        <div id="view-dash" class="view">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:50px;">
                <div>
                    <h2 id="welcome-user" style="font-size:2.5rem; font-weight:900;">Systèmes_Actifs</h2>
                    <p style="color:var(--glow); font-size:12px; font-weight:bold; letter-spacing:2px;">AUTHENTICATION_VERIFIED</p>
                </div>
                <button class="btn" style="background:transparent; border:1px solid #222; color:#555;" onclick="location.reload()">SHUT_DOWN</button>
            </div>

            <div class="grid" id="main-grid"></div>

            <div id="master-panel" style="display:none;" class="admin-wrap">
                <div class="admin-tag">Master Node Configuration</div>
                
                <div style="background:rgba(0,0,0,0.3); padding:30px; border-radius:24px; margin-bottom:30px;">
                    <h4 style="font-size:12px; margin-bottom:15px; opacity:0.6;">AUTOLOGIN : GÉNÉRATEUR DE TICKET CAS PRONOTE</h4>
                    <div class="form-box">
                        <input type="text" id="cas-target" placeholder="Email de l'utilisateur (ex: nom.prenom@campus-rosaparks.fr)">
                        <button class="btn btn-admin" onclick="createCASTicket()">GÉNÉRER LE TICKET</button>
                    </div>
                    <div id="cas-display" style="font-family:monospace; font-size:12px; color:var(--glow);"></div>
                </div>

                <h4 style="font-size:12px; margin-bottom:15px; opacity:0.6;">DÉPLOIEMENT GLOBAL DE SERVICES</h4>
                <div class="form-box">
                    <input type="text" id="new-ico" placeholder="Emoji" style="max-width:80px;">
                    <input type="text" id="new-name" placeholder="Nom du Service">
                    <input type="text" id="new-url" placeholder="URL de destination">
                    <button class="btn btn-glow" onclick="deployService()">PUBLIER</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
