<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSA PARKS | NEURAL CONNECT v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --glow: #00f2ff;
            --admin-glow: #ff0055;
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        .app-wrapper {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
        }

        .holo-frame {
            width: 95%; max-width: 1200px; height: 85vh;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 80px rgba(0,0,0,1);
        }

        .cyber-header {
            padding: 25px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-text { font-weight: 800; font-size: 1rem; letter-spacing: 4px; color: var(--glow); text-shadow: 0 0 15px var(--glow); }

        .view { display: none; padding: 40px; overflow-y: auto; height: 100%; }
        .view.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* GRID SERVICES */
        .grid-system { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

        .cyber-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 24px; padding: 30px 20px; text-align: center;
            transition: 0.4s; cursor: pointer; text-decoration: none; color: white;
            position: relative;
        }

        .cyber-card:hover { border-color: var(--glow); background: rgba(0, 242, 255, 0.05); transform: translateY(-5px); }

        /* BOUTON SUPPRIMER (ADMIN) */
        .del-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(255,0,85,0.2);
            color: var(--admin-glow); border: none; border-radius: 8px; padding: 5px 8px;
            cursor: pointer; font-size: 10px; display: none;
        }
        .admin-mode .del-btn { display: block; }

        /* ADMIN STYLES */
        .admin-layer {
            margin-top: 40px; padding: 30px; border-radius: 30px;
            background: rgba(255,0,85,0.02); border: 1px solid rgba(255,0,85,0.1);
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input {
            flex: 1; background: #000; border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; color: white; outline: none;
        }

        .btn { padding: 15px 25px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-logout { background: transparent; color: #ff4b2b; border: 1px solid #ff4b2b22; }
        .btn-logout:hover { background: #ff4b2b; color: white; }
        .btn-admin { background: var(--admin-glow); color: white; }

        .log-table { width: 100%; font-size: 11px; margin-top: 20px; border-collapse: collapse; }
        .log-table td { padding: 10px; border-bottom: 1px solid var(--border); color: #666; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="holo-frame">
            <div class="cyber-header">
                <div class="logo-text">ROSA PARKS // INFRA</div>
                <div id="header-right"></div>
            </div>

            <div id="view-login" class="view active">
                <div style="text-align:center; margin-top:15vh;">
                    <h1 style="font-size:3rem; margin-bottom:40px;">Neural<span style="color:var(--glow)">Connect</span></h1>
                    <div style="display:flex; justify-content:center;">
                        <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="handleAuth"></div>
                        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
                    </div>
                </div>
            </div>

            <div id="view-dash" class="view">
                <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
                    <h2 id="user-greeting">Système Prêt</h2>
                    <button class="btn btn-logout" onclick="logout()">DÉCONNEXION</button>
                </div>

                <div class="grid-system" id="srv-grid"></div>

                <div id="admin-panel" style="display:none;">
                    <div class="admin-layer">
                        <h3 style="color:var(--admin-glow); margin-bottom:20px;">MAÎTRE // CONSOLE</h3>
                        
                        <div class="input-group">
                            <input type="text" id="new-ico" placeholder="Emoji" style="max-width:80px">
                            <input type="text" id="new-name" placeholder="Nom">
                            <input type="text" id="new-url" placeholder="URL">
                            <button class="btn btn-admin" onclick="addService()">DÉPLOYER</button>
                        </div>

                        <div style="margin-top:30px">
                            <p style="font-size:11px; opacity:0.5; margin-bottom:10px;">GÉRER LES ACCÈS CAS</p>
                            <div class="input-group">
                                <input type="text" id="cas-mail" placeholder="Utilisateur @campus-rosaparks.fr">
                                <button class="btn btn-admin" onclick="createTicket()">LIER TICKET</button>
                            </div>
                        </div>

                        <table class="log-table">
                            <tbody id="log-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
