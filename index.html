<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSA PARKS | NEURAL CONNECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --glow: #00f2ff;
            --admin-glow: #ff0055;
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        .app-wrapper {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
        }

        .holo-frame {
            width: 95%; max-width: 1200px; height: 85vh;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 80px rgba(0,0,0,1);
        }

        .cyber-header {
            padding: 30px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-text { font-weight: 800; font-size: 1.2rem; letter-spacing: 4px; color: var(--glow); text-shadow: 0 0 15px var(--glow); }

        .view { display: none; padding: 50px; overflow-y: auto; height: 100%; }
        .view.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* AUTH */
        .auth-container { text-align: center; margin-top: 10vh; }
        .auth-container h1 { font-size: 4rem; font-weight: 200; letter-spacing: -2px; }

        /* GRID */
        .grid-system { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; margin-top: 20px; }
        .cyber-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 20px; text-align: center; cursor: pointer;
            text-decoration: none; color: white; transition: 0.3s;
        }
        .cyber-card:hover { border-color: var(--glow); transform: translateY(-5px); background: rgba(0, 242, 255, 0.05); }

        /* ADMIN */
        .admin-layer { margin-top: 60px; padding: 40px; border-radius: 30px; border: 1px solid rgba(255,0,85,0.2); background: rgba(255,0,85,0.02); }
        .input-group { display: flex; gap: 15px; margin-bottom: 20px; }
        input { flex: 1; background: #000; border: 1px solid var(--border); padding: 18px; border-radius: 15px; color: white; outline: none; }
        
        .btn-glow { padding: 15px 25px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: #fff; color: #000; }
        .btn-admin { background: var(--admin-glow); color: #fff; }
        .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; margin-left: 20px; }
        .btn-delete { background: #ff4444; color: white; padding: 5px 10px; border-radius: 5px; font-size: 10px; border: none; cursor: pointer; }

        .log-list { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.8rem; }
        .log-list td { padding: 12px; border-bottom: 1px solid var(--border); color: #888; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="holo-frame">
            <div class="cyber-header">
                <div class="logo-text">ROSA PARKS // INFRA</div>
                <div id="header-right">
                    <span id="status-display" style="font-size: 10px; color: #444;">WAITING_AUTH</span>
                    <button id="logout-btn" class="btn-glow btn-logout" style="display:none;" onclick="logout()">LOGOUT</button>
                </div>
            </div>

            <div id="view-login" class="view active">
                <div class="auth-container">
                    <h1>Cloud<span>Connect</span></h1>
                    <p style="opacity: 0.3; margin-bottom: 50px;">RESTRICTED TO @CAMPUS-ROSAPARKS.FR</p>
                    <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="handleAuth"></div>
                    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
                </div>
            </div>

            <div id="view-dash" class="view">
                <h2 id="welcome-txt" style="font-size: 2.5rem; font-weight: 800; margin-bottom: 30px;">Système Actif</h2>
                <div class="grid-system" id="srv-grid"></div>

                <div id="admin-panel" style="display:none;">
                    <div class="admin-layer">
                        <h3 style="color:var(--admin-glow); margin-bottom:20px;">MASTER CONSOLE</h3>
                        
                        <div class="input-group">
                            <input type="text" id="new-ico" placeholder="Emoji" style="max-width:80px">
                            <input type="text" id="new-name" placeholder="Nom du Service">
                            <input type="text" id="new-url" placeholder="URL">
                            <button class="btn-glow btn-primary" onclick="addService()">DÉPLOYER</button>
                        </div>

                        <div id="manage-services-list" style="margin-bottom: 40px;">
                            </div>

                        <div class="input-group">
                            <input type="text" id="cas-target" placeholder="Email pour bypass Pronote">
                            <button class="btn-glow btn-admin" onclick="createCAS()">ACTIVER BYPASS</button>
                        </div>

                        <table class="log-list"><tbody id="log-table"></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
