<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Parks | Cloud Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Animation de fond étoilé */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: -1;
        }

        .portal-box {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 60px 40px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Ligne lumineuse en haut */
        .portal-box::before {
            content: "";
            position: absolute;
            top: -1px; left: 20%; right: 20%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 10px; }
        .desc { color: #666; font-size: 0.95rem; margin-bottom: 40px; }

        /* Message d'erreur personnalisé */
        #error-overlay {
            display: none;
            color: #ff4b2b;
            background: rgba(255, 75, 43, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 75, 43, 0.2);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Dashboard */
        #dashboard { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }

        .btn-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 15px;
            border-radius: 20px;
            text-decoration: none;
            color: #ccc;
            transition: 0.3s;
            display: block;
        }

        .btn-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--neon-blue);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .icon { font-size: 28px; display: block; margin-bottom: 10px; }

        #google-container { display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="portal-box" id="mainBox">
        
        <div id="login-section">
            <h1 id="title">Rosa Parks</h1>
            <p class="desc">Portail exclusif @campus-rosaparks.fr</p>

            <div id="error-overlay">⚠️ Accès refusé. Utilisez votre compte campus.</div>

            <div id="google-container">
                <div id="g_id_onload"
                     data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="checkAccount"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
            </div>
        </div>

        <div id="dashboard">
            <h2 style="font-size: 1.8rem;">Espace Personnel</h2>
            <p class="desc">Connecté avec succès</p>

            <div class="grid">
                <a href="#" class="btn-item"><span class="icon">🦋</span>Pronote</a>
                <a href="#" class="btn-item"><span class="icon">✉️</span>Webmail</a>
                <a href="#" class="btn-item"><span class="icon">📂</span>Drive</a>
                <a href="#" class="btn-item"><span class="icon">🌐</span>Site</a>
            </div>

            <button onclick="location.reload()" style="margin-top: 40px; background:none; border:none; color:#444; cursor:pointer; font-size:0.8rem;">Déconnexion</button>
        </div>

    </div>

    <script>
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(window.atob(base64));
        }

        function checkAccount(response) {
            const userData = parseJwt(response.credential);
            const email = userData.email;
            const errorBox = document.getElementById('error-overlay');

            // --- LA VÉRIFICATION DU DOMAINE ---
            if (email.endsWith("@campus-rosaparks.fr")) {
                // Succès
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('mainBox').style.borderColor = 'rgba(0, 210, 255, 0.3)';
            } else {
                // Échec : Mauvais domaine
                errorBox.style.display = 'block';
                // Petit effet visuel pour montrer que c'est bloqué
                console.log("Tentative bloquée pour : " + email);
            }
        }
    </script>
</body>
</html>
