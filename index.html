<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP CLOUD // SECURE GATEWAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --glow: #00f2ff; --admin: #ff0055; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* Animation de fond */
        .scanline { width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1); position: fixed; top: 0; z-index: 10; animation: scan 4s linear infinite; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .app-container { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #080808 0%, #000 100%); }

        .glass-panel {
            width: 90%; max-width: 1100px; height: 80vh;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        /* Top Bar */
        .top-nav { padding: 25px 40px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .sys-status { font-size: 11px; letter-spacing: 2px; color: var(--glow); text-transform: uppercase; }

        /* Views */
        .view { display: none; padding: 50px; overflow-y: auto; flex: 1; }
        .view.active { display: block; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Login view */
        .login-center { text-align: center; margin-top: 15vh; }
        .login-center h1 { font-size: 3rem; font-weight: 300; margin-bottom: 40px; }

        /* Dashboard */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .service-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer;
            transition: 0.3s; text-decoration: none; color: white; display: block;
        }
        .service-card:hover { border-color: var(--glow); background: rgba(0, 242, 255, 0.05); transform: translateY(-5px); }
        .ico { font-size: 40px; margin-bottom: 15px; display: block; }

        /* Admin area */
        .admin-box { margin-top: 50px; padding: 30px; border-radius: 25px; border: 1px solid rgba(255,0,85,0.3); background: rgba(255,0,85,0.02); }
        input { background: #000; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; width: 100%; margin-bottom: 10px; }
        
        /* Logout Button */
        .logout-btn { background: none; border: 1px solid #333; color: #555; padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { border-color: #ff4b2b; color: #ff4b2b; }

        .btn-main { background: #fff; color: #000; padding: 15px 30px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="app-container">
        <div class="glass-panel">
            <div class="top-nav">
                <div class="sys-status" id="sys-status">// SYSTEM_AWAITING_AUTH</div>
                <button class="logout-btn" id="logout-trigger" style="display:none;" onclick="logout()">LOGOUT</button>
            </div>

            <div id="view-login" class="view active">
                <div class="login-center">
                    <h1>CAMPUS<span>ROSA</span>PARKS</h1>
                    <div style="display: flex; justify-content: center;">
                        <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="handleAuth"></div>
                        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
                    </div>
                </div>
            </div>

            <div id="view-dash" class="view">
                <h2 style="margin-bottom: 30px; font-weight: 300;">Portail <span style="color:var(--glow)">Cloud</span></h2>
                <div class="grid" id="grid-container"></div>

                <div id="admin-zone" style="display:none;" class="admin-box">
                    <h3 style="color:var(--admin); margin-bottom:20px;">MASTER_CONSOLE</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:10px;">
                        <input type="text" id="in-ico" placeholder="Emoji">
                        <input type="text" id="in-name" placeholder="Nom">
                        <input type="text" id="in-url" placeholder="Lien">
                        <button class="btn-main" onclick="publishSrv()">PUBLISH</button>
                    </div>
                    <div style="margin-top:20px;">
                        <input type="text" id="cas-user" placeholder="Email pour lien CAS Pronote">
                        <button class="btn-main" style="background:var(--admin); color:#fff;" onclick="bindCAS()">GENERATE CAS TICKET</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
