<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ROSA PARKS | NEURAL CONNECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --neon: #00ff41; /* Vert Matrix/Cyber */
            --bg: #050505;
            --card-bg: rgba(10, 10, 10, 0.95);
            --border: rgba(0, 255, 65, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        
        body {
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        .container {
            max-width: 1200px; margin: 0 auto; padding: 40px 20px;
            position: relative; z-index: 1;
        }

        header { text-align: center; margin-bottom: 60px; }
        h1 { 
            font-family: 'Syncopate', sans-serif; font-size: 3.5rem; letter-spacing: 15px;
            text-transform: uppercase; color: var(--neon); text-shadow: 0 0 20px var(--neon);
        }

        /* Glassmorphism Cyber */
        .glass-panel {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 0px; /* Style brutaliste */
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        /* Grid Services */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        
        .card {
            border: 1px solid var(--border); padding: 30px;
            transition: all 0.3s; cursor: pointer; text-decoration: none; color: #fff;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 100%);
        }

        .card:hover {
            background: var(--neon); color: #000; box-shadow: 0 0 40px var(--neon);
            transform: scale(1.02);
        }

        .card h3 { font-family: 'Syncopate', sans-serif; font-size: 0.8rem; margin-top: 15px; }

        /* Admin Section */
        #admin-zone { display: none; margin-top: 80px; border-top: 2px solid var(--neon); padding-top: 40px; }
        .admin-header { font-family: 'Syncopate'; color: var(--neon); margin-bottom: 30px; }

        input, select {
            background: #000; border: 1px solid var(--neon); padding: 15px;
            color: var(--neon); width: 100%; margin-bottom: 10px;
        }

        .btn {
            background: var(--neon); color: #000; padding: 15px 30px; 
            border: none; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        #log-display {
            background: #000; padding: 20px; border: 1px solid #333;
            font-family: 'Courier New', monospace; font-size: 0.8rem; height: 200px; overflow-y: auto;
        }

        #login-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h1 style="font-size: 2rem; margin-bottom: 50px;">ACCESS RESTRICTED</h1>
        <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="onConnect"></div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div class="container">
        <header>
            <h1>ROSA PARKS</h1>
            <p id="user-display" style="color: var(--neon); margin-top: 10px;"></p>
        </header>

        <div class="grid" id="services-grid">
            </div>

        <div id="admin-zone">
            <h2 class="admin-header">> COMMAND_CENTER [ROOT]</h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                <div>
                    <h3>AJOUTER SERVICE</h3>
                    <input type="text" id="new-emoji" placeholder="EMOJI">
                    <input type="text" id="new-title" placeholder="TITRE">
                    <input type="text" id="new-link" placeholder="LIEN URL">
                    <button class="btn" onclick="ui.addService()">INJECTER SERVICE</button>
                </div>
                
                <div>
                    <h3>CAS CONFIGURATOR (PRONOTE)</h3>
                    <input type="text" id="cas-id" placeholder="ID CAS UNIQUE (EX: RP-992)">
                    <select id="user-selector">
                        <option>CHARGEMENT DES UTILISATEURS...</option>
                    </select>
                    <button class="btn" onclick="ui.linkCAS()">LIER CAS AU MAIL</button>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <h3>SYSTEM LOGS</h3>
                <div id="log-display"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
