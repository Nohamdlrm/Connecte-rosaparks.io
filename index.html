<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Services | Campus Rosa Parks</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --saumon: #FF8C76;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 140, 118, 0.15);
            --discord: #5865F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Lueur de fond */
        .glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 140, 118, 0.08) 0%, transparent 70%);
            z-index: -1;
        }

        header { text-align: center; margin-bottom: 50px; }
        
        .pre-title { color: var(--saumon); text-transform: uppercase; letter-spacing: 5px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; display: block; }
        
        h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; background: linear-gradient(to bottom, #fff, var(--saumon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px 20px;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--saumon);
            background: rgba(255, 140, 118, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .icon-wrapper {
            width: 80px; height: 80px;
            border-radius: 22px;
            background: #000; /* Fond noir pour éviter le blanc du logo */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .icon-img { width: 100%; height: 100%; object-fit: cover; }
        .icon-svg { width: 45px; height: 45px; }

        h2 { font-size: 1.25rem; margin-bottom: 10px; }
        p { font-size: 0.85rem; color: #94a3b8; font-weight: 300; line-height: 1.4; }

        /* Discord Petit en bas */
        .discord-btn {
            margin-top: 50px;
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.2);
            padding: 12px 25px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .discord-btn:hover {
            background: var(--discord);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.3);
        }

        .discord-btn svg { width: 24px; fill: white; }

    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container" style="display: contents;">
        <header>
            <span class="pre-title">Campus Rosa Parks</span>
            <h1>Portail des Services</h1>
        </header>

        <div class="grid">
            <a href="https://campus-rosaparks.fr" class="card">
                <div class="icon-wrapper" style="background: rgba(255,255,255,0.03);">
                    <img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" class="icon-img" style="width: 45px; height: 45px; object-fit: contain;">
                </div>
                <h2>Site Web</h2>
                <p>L'actualité officielle du campus.</p>
            </a>

            <a href="https://accounts.google.com/" class="card">
                <div class="icon-wrapper" style="background: rgba(255,255,255,0.03);">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                    </svg>
                </div>
                <h2>Workspace</h2>
                <p>Emails et outils Google.</p>
            </a>

            <a href="https://pronote.campus-rosaparks.fr/" class="card">
                <div class="icon-wrapper">
                    <img src="https://pbs.twimg.com/profile_images/1958506860039815168/9AX_OQfq_400x400.jpg" class="icon-img" alt="Pronote">
                </div>
                <h2>Pronote</h2>
                <p>Notes et emploi du temps.</p>
            </a>

            <a href="https://recrutement.campus-rosaparks.fr/" class="card">
                <div class="icon-wrapper" style="background: rgba(255,255,255,0.03);">
                    <img src="https://cdn-icons-png.flaticon.com/512/3850/3850285.png" class="icon-img" style="width: 45px; height: 45px; object-fit: contain;">
                </div>
                <h2>Recrutement</h2>
                <p>Espace emploi et talents.</p>
            </a>
        </div>

        <a href="https://discord.gg/rosaparks" class="discord-btn" target="_blank">

            Rejoindre le Discord
        </a>
    </div>

</body>
</html>
