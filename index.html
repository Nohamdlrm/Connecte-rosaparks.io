<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP-CLOUD | INFRASTRUCTURE SÉCURISÉE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --accent: #00f2ff; --admin: #ff0055; --bg: #020202; --panel: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        .app-frame { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 50%, #0a0a0c 0%, #000 100%); }
        .glass-container { width: 92%; max-width: 1100px; height: 82vh; background: var(--panel); backdrop-filter: blur(40px); border: 1px solid var(--border); border-radius: 35px; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9); }

        /* BARRE DE STATUT */
        .status-bar { padding: 25px 35px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .node-id { font-weight: 900; letter-spacing: 4px; color: var(--accent); font-size: 13px; text-shadow: 0 0 15px var(--accent); }

        /* VIEWS */
        .view { display: none; padding: 40px; overflow-y: auto; flex: 1; scrollbar-width: none; }
        .view.active { display: block; animation: viewIn 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        @keyframes viewIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* AUTH */
        .login-box { text-align: center; margin-top: 12vh; }
        .login-box h1 { font-size: 4rem; font-weight: 900; letter-spacing: -3px; line-height: 0.9; margin-bottom: 20px; }
        .login-box span { color: var(--accent); }

        /* DASHBOARD GRID */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .srv-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 25px; padding: 40px 20px; text-align: center; text-decoration: none; color: white; transition: 0.4s; position: relative; }
        .srv-card:hover { border-color: var(--accent); background: rgba(0,242,255,0.05); transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,242,255,0.1); }
        .srv-card .ico { font-size: 50px; display: block; margin-bottom: 15px; }
        .delete-ico { position: absolute; top: 15px; right: 15px; background: none; border: none; color: rgba(255,255,255,0.1); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .delete-ico:hover { color: var(--admin); transform: scale(1.2); }

        /* ADMIN CONSOLE */
        .admin-section { margin-top: 50px; padding: 35px; border: 1px solid rgba(255,0,85,0.2); border-radius: 30px; background: linear-gradient(145deg, rgba(255,0,85,0.03), transparent); }
        .admin-section h3 { color: var(--admin); margin-bottom: 25px; font-weight: 900; letter-spacing: 1px; }
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        input { flex: 1; background: #000; border: 1px solid var(--border); padding: 16px; border-radius: 14px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }
        .btn { padding: 16px 30px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 12px; }
        .btn-main { background: #fff; color: #000; }
        .btn-admin { background: var(--admin); color: #fff; }
        .btn-logout { background: transparent; border: 1px solid #333; color: #666; }
        .btn-logout:hover { border-color: #fff; color: #fff; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 11px; color: #555; }
        td { padding: 12px; border-bottom: 1px solid #111; }
    </style>
</head>
<body>
    <div class="app-frame">
        <div class="glass-container">
            <div class="status-bar">
                <div class="node-id">ROSA_PARKS_INFRA // V2</div>
                <div id="user-display" style="font-size:10px; color:#444;">WAITING_AUTH</div>
            </div>

            <div id="view-login" class="view active">
                <div class="login-box">
                    <h1>Cloud<span>Portal</span></h1>
                    <p style="opacity:0.3; margin-bottom:40px; letter-spacing:2px;">ACCÈS RESTREINT AU DOMAINE CAMPUS</p>
                    <div style="display:flex; justify-content:center;">
                        <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="onAuth"></div>
                        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
                    </div>
                </div>
            </div>

            <div id="view-dash" class="view">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:40px;">
                    <div>
                        <h2 id="welcome-msg" style="font-size: 2.5rem; font-weight:900;">Accès autorisé</h2>
                        <p id="user-mail-sub" style="color:var(--accent); font-size:14px; opacity:0.6;"></p>
                    </div>
                    <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
                </div>
                
                <div class="services-grid" id="srv-grid"></div>

                <div id="admin-zone" style="display:none;" class="admin-section">
                    <h3>PANNEAU DE CONTRÔLE MAÎTRE</h3>
                    
                    <div style="background:rgba(0,0,0,0.3); padding:20px; border-radius:15px; margin-bottom:25px;">
                        <p style="font-size:11px; opacity:0.5; margin-bottom:10px;">GÉNÉRATEUR DE TICKET CAS (CONNEXION DIRECTE PRONOTE)</p>
                        <div class="input-group">
                            <input type="text" id="cas-target" placeholder="Email de l'utilisateur (ex: julien.messai@...)">
                            <button class="btn btn-admin" onclick="createCASTicket()">Lier le compte</button>
                        </div>
                        <div id="cas-log" style="font-size:11px; color:var(--accent)"></div>
                    </div>

                    <p style="font-size:11px; opacity:0.5; margin-bottom:10px;">DÉPLOYER UN NOUVEAU SERVICE GLOBAL</p>
                    <div class="input-group">
                        <input type="text" id="new-ico" placeholder="Emoji" style="max-width:80px; text-align:center;">
                        <input type="text" id="new-name" placeholder="Nom du Service">
                        <input type="text" id="new-url" placeholder="URL du lien">
                        <button class="btn btn-main" onclick="publishService()">Publier</button>
                    </div>

                    <table id="logs-list"></table>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
