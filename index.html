<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>UltraConnect | Rosa Parks Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* CSS ULTRA LOURD - DESIGN 2026 */
        :root {
            --bg: #030305;
            --panel: rgba(15, 15, 20, 0.8);
            --accent: #00f2ff;
            --admin-color: #ff0055;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Effets de lumière en fond */
        .glow {
            position: fixed;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Container Principal */
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: var(--panel);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            width: 100%;
            max-width: 1100px;
            min-height: 700px;
            padding: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Titres */
        h1 { font-weight: 800; font-size: 3rem; margin-bottom: 10px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Dashboard Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .service-item {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .service-item:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            background: rgba(0, 242, 255, 0.05);
        }

        .emoji { font-size: 40px; margin-bottom: 15px; display: block; }

        /* Admin Panel */
        #admin-panel {
            display: none;
            margin-top: 50px;
            padding-top: 50px;
            border-top: 1px dashed var(--border);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.8rem;
        }

        .log-table th, .log-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .admin-badge {
            background: var(--admin-color);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Formulaire d'ajout de service */
        .add-service-form {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        button.btn-add {
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #login-screen { text-align: center; }
        #dashboard { display: none; }
    </style>
</head>
<body>
    <div class="glow" style="top: -10%; left: -10%;"></div>
    <div class="glow" style="bottom: -10%; right: -10%;"></div>

    <div class="app-container">
        <div class="main-card" id="mainCard">
            
            <div id="login-screen">
                <h1>Rosa Parks Cloud</h1>
                <p style="color: #666; margin-bottom: 40px;">Authentification sécurisée requise</p>
                <div id="g_id_onload"
                     data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
            </div>

            <div id="dashboard">
                <div id="user-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 id="welcome-msg">Bonjour</h2>
                        <p id="user-email" style="color: var(--accent)"></p>
                    </div>
                    <div id="admin-tag"></div>
                </div>

                <div class="services-grid" id="servicesGrid">
                    </div>

                <div id="admin-panel">
                    <h3 style="color: var(--admin-color)">Console Maître Administrateur</h3>
                    
                    <div class="add-service-form">
                        <input type="text" id="srvEmoji" placeholder="Emoji (ex: 🚀)">
                        <input type="text" id="srvTitle" placeholder="Titre">
                        <input type="text" id="srvLink" placeholder="Lien">
                        <button class="btn-add" onclick="addService()">Ajouter Service</button>
                    </div>

                    <h4>Logs des connexions</h4>
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Utilisateur</th>
                                <th>Heure</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>

                <button onclick="location.reload()" style="margin-top: 50px; background: none; border: none; color: #444; cursor: pointer;">Déconnexion</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
