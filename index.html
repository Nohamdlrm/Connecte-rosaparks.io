<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rosa Parks | Nexus Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #00ff88; /* Vert Néon Cyber */
            --admin-red: #ff0044;
            --glass: rgba(255, 255, 255, 0.02);
            --card-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        body {
            background: var(--bg);
            color: #e0e0e0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1a3328 0%, transparent 50%);
        }

        /* Container Principal */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 60px;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            position: relative;
        }

        /* Titre Néon */
        h1 { font-size: 3.5rem; font-weight: 700; letter-spacing: -2px; margin-bottom: 5px; color: #fff; }
        .neon-line { height: 4px; width: 80px; background: var(--accent); margin-bottom: 40px; border-radius: 2px; box-shadow: 0 0 15px var(--accent); }

        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; }

        .service-link {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: 0.3s all ease;
            position: relative;
        }

        .service-link:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }

        .service-link b { font-size: 1.2rem; display: block; margin-top: 10px; }

        /* Admin Console */
        #adminArea {
            display: none;
            margin-top: 80px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 15px;
            padding: 40px;
            border: 1px dashed var(--border);
        }

        .admin-header { display: flex; align-items: center; gap: 15px; color: var(--admin-red); margin-bottom: 30px; }
        
        .cas-config-box {
            background: #000;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid var(--accent);
            margin-bottom: 20px;
        }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        
        input, select {
            background: #111;
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            flex-grow: 1;
            outline: none;
        }

        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-accent { background: var(--accent); color: #000; }
        .btn-accent:hover { filter: brightness(1.2); transform: scale(1.02); }

        /* Logs */
        .log-list { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        .log-list td { padding: 15px; border-bottom: 1px solid var(--border); color: #888; }
        .log-list span.user { color: var(--accent); font-weight: 500; }

        #loginView { text-align: center; }
        #mainView { display: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="app">
            
            <div id="loginView">
                <h1>CAMPUS RP</h1>
                <div class="neon-line" style="margin: 0 auto 40px;"></div>
                <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="onAuth"></div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
            </div>

            <div id="mainView">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1 id="welcomeTitle">ACCESS</h1>
                        <div class="neon-line"></div>
                    </div>
                    <div id="badgeAdmin"></div>
                </div>

                <div class="grid" id="gridServices"></div>

                <div id="adminArea">
                    <div class="admin-header">
                        <h2>SYSTEM OVERRIDE</h2>
                        <span>| Root Access ce.0227235a</span>
                    </div>

                    <div class="cas-config-box">
                        <h3>Générateur de Configuration CAS</h3>
                        <p style="font-size: 0.8rem; color: #666; margin-bottom: 15px;">Créez un CAS pour lier un mail à la connexion automatique Pronote.</p>
                        
                        <div class="input-group">
                            <input type="text" id="casUserMail" placeholder="Mail de l'élève (ex: nom.prenom@...)">
                            <button class="btn-accent" onclick="generateCAS()">GÉNÉRER & COPIER</button>
                        </div>
                        <p id="casStatus" style="font-size: 0.85rem; color: var(--accent); display: none;">✓ CAS généré et copié ! Prêt à être injecté.</p>
                    </div>

                    <div class="input-group">
                        <input type="text" id="newSrvEmoji" placeholder="Emoji">
                        <input type="text" id="newSrvName" placeholder="Titre du service">
                        <input type="text" id="newSrvLink" placeholder="URL">
                        <button class="btn-accent" onclick="addNewService()">AJOUTER</button>
                    </div>

                    <h3>TRAFFIC LOGS</h3>
                    <table class="log-list">
                        <tbody id="logDisplay"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
