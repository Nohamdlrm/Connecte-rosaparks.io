<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Parks | Portail Numérique</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: #0b0e14;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- ANIMATION DE FOND (LES BULLES) --- */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        .blob-1 { background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { background: var(--secondary); bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        /* --- CARTE PRINCIPALE --- */
        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: appear 0.8s ease-out;
        }

        h1 { font-size: 2.2rem; font-weight: 600; margin-bottom: 10px; background: linear-gradient(to right, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 40px; }

        /* --- SERVICES DASHBOARD --- */
        #dashboard { display: none; }
        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px; }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            text-decoration: none;
            color: white;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .service-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .icon-box { font-size: 32px; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .service-card span { font-weight: 500; font-size: 0.9rem; letter-spacing: 0.5px; }

        /* --- GOOGLE BUTTON --- */
        #google-signin-wrapper { display: flex; justify-content: center; margin-top: 20px; }

        @keyframes appear {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge { display: inline-block; padding: 6px 16px; background: rgba(99, 102, 241, 0.2); color: #818cf8; border-radius: 100px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 20px; border: 1px solid rgba(99, 102, 241, 0.3); }

    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="glass-container" id="mainContainer">
        
        <div id="loginSection">
            <div class="badge">Espace Sécurisé</div>
            <h1>Campus Rosa Parks</h1>
            <p class="subtitle">Veuillez vérifier votre identité avec Google</p>
            
            <div id="google-signin-wrapper">
                <div id="g_id_onload"
                     data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="onGoogleAuth"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
            </div>
        </div>

        <div id="dashboard">
            <div class="badge" style="color: #4ade80; background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.2);">Accès Autorisé ✓</div>
            <h2>Bienvenue</h2>
            <p class="subtitle">Vos outils pédagogiques</p>

            <div class="services-grid">
                <a href="https://index.pronote.net" target="_blank" class="service-card">
                    <div class="icon-box">🦋</div>
                    <span>Pronote</span>
                </a>
                <a href="https://mail.google.com" target="_blank" class="service-card">
                    <div class="icon-box">✉️</div>
                    <span>Webmail</span>
                </a>
                <a href="https://drive.google.com" target="_blank" class="service-card">
                    <div class="icon-box">📂</div>
                    <span>Drive</span>
                </a>
                <a href="https://campus-rosaparks.fr" target="_blank" class="service-card">
                    <div class="icon-box">🌐</div>
                    <span>Site Web</span>
                </a>
            </div>
            <button onclick="location.reload()" style="margin-top: 40px; background: none; border: none; color: #64748b; cursor: pointer; font-size: 0.8rem; text-decoration: underline;">Se déconnecter</button>
        </div>
    </div>

    <script>
        function onGoogleAuth(response) {
            const container = document.getElementById('mainContainer');
            container.style.opacity = '0';
            container.style.transform = 'scale(0.9)';

            setTimeout(() => {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                container.style.opacity = '1';
                container.style.transform = 'scale(1)';
                container.style.maxWidth = '600px';
            }, 600);
        }
    </script>
</body>
</html>
