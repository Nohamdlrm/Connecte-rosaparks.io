<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP-OS | Interface de Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff; /* Cyan néon */
            --accent-dim: rgba(0, 242, 255, 0.1);
            --bg: #030303;
            --card: rgba(15, 15, 15, 0.8);
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        body {
            background-color: var(--bg);
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Animation de fond (Glow subtil) */
        body::before {
            content: "";
            position: absolute;
            width: 300px; height: 300px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.1;
            top: 10%; left: 10%;
            z-index: 0;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 1200px;
            padding: 40px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .title-group h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .title-group p {
            color: var(--accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .status-tag {
            font-size: 0.7rem;
            padding: 5px 12px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 5px;
            font-weight: 700;
        }

        /* Grille Interactive */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .service-link {
            text-decoration: none;
            color: inherit;
        }

        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .card::after {
            content: "→";
            position: absolute;
            right: 20px; bottom: 20px;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-10px);
            transition: 0.3s;
        }

        .card:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 15px;
            display: block;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.5;
        }

        /* Bouton Discord Minimaliste */
        .discord-bar {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .discord-btn {
            background: transparent;
            border: 1px solid #5865F2;
            color: #5865F2;
            padding: 10px 30px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .discord-btn:hover {
            background: #5865F2;
            color: white;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
        }

    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <div class="title-group">
                <p>Système Central v2.0</p>
                <h1>Rosa Parks <span style="font-weight: 300; opacity: 0.5;">Hub</span></h1>
            </div>
            <div class="status-tag">SYSTÈME OPÉRATIONNEL</div>
        </header>

        <div class="grid">
            <a href="#" class="service-link">
                <div class="card">
                    <span class="icon">🦋</span>
                    <h2>Pronote</h2>
                    <p>Gestion scolaire et notes en temps réel.</p>
                </div>
            </a>

            <a href="#" class="service-link">
                <div class="card">
                    <span class="icon">💻</span>
                    <h2>Workspace</h2>
                    <p>Accès Cloud et suite collaborative.</p>
                </div>
            </a>

            <a href="#" class="service-link">
                <div class="card">
                    <span class="icon">📨</span>
                    <h2>Webmail</h2>
                    <p>Messagerie sécurisée du campus.</p>
                </div>
            </a>

            <a href="#" class="service-link">
                <div class="card">
                    <span class="icon">⚙️</span>
                    <h2>Recrutement</h2>
                    <p>Portail des talents et carrières.</p>
                </div>
            </a>
        </div>

        <div class="discord-bar">
            <a href="#" class="discord-btn">REJOINDRE LE DISCORD OFFICIEL</a>
        </div>
    </div>

</body>
</html>
