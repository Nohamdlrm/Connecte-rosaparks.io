<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RP Cloud | Infrastructure v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --accent: #00ff88;
            --admin: #ff0055;
            --bg: #030303;
            --panel: rgba(10, 10, 10, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* Effet de grille animée en fond */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .container { height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .main-frame {
            background: var(--panel);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 30px;
            width: 100%; max-width: 1100px; height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 0 150px rgba(0, 255, 136, 0.05);
            position: relative; overflow: hidden;
        }

        .main-frame::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .top-bar {
            padding: 20px 30px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .view { display: none; padding: 40px; overflow-y: auto; flex: 1; }
        .view.active { display: block; animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* Grid Services */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 40px 20px; border-radius: 20px; text-decoration: none; color: #fff;
            text-align: center; transition: all 0.4s; position: relative;
        }
        .card:hover { 
            background: rgba(0, 255, 136, 0.05); 
            border-color: var(--accent); 
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1);
        }
        .emoji { font-size: 45px; display: block; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        /* Section Admin Styles */
        .admin-box { 
            background: rgba(255, 0, 85, 0.05); border: 1px solid rgba(255, 0, 85, 0.2);
            padding: 30px; border-radius: 25px; margin-top: 40px;
        }
        input { 
            background: #000; border: 1px solid var(--border); color: #fff; padding: 15px; 
            border-radius: 12px; margin-bottom: 10px; width: 100%; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }

        .btn {
            background: #fff; color: #000; padding: 15px 30px; border-radius: 12px;
            border: none; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--accent); transform: scale(1.05); }
        .btn-admin { background: var(--admin); color: #fff; }

        .log-table { width: 100%; margin-top: 20px; border-spacing: 0 8px; border-collapse: separate; }
        .log-table td { background: rgba(255,255,255,0.02); padding: 15px; font-size: 13px; }
        .log-table td:first-child { border-radius: 10px 0 0 10px; color: var(--accent); }
        .log-table td:last-child { border-radius: 0 10px 10px 0; }

        #login-view { text-align: center; padding-top: 10vh; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <div class="main-frame">
            <div class="top-bar">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="width:12px; height:12px; background:var(--accent); border-radius:50%; box-shadow:0 0 15px var(--accent);"></div>
                    <span style="font-weight:800; letter-spacing:2px; font-size:14px;">ROSA PARKS OS</span>
                </div>
                <div id="user-info" style="font-size: 12px; opacity:0.6; font-weight:500;">SYSTÈME HORS LIGNE</div>
            </div>

            <div id="view-login" class="view active">
                <div id="login-view">
                    <h1 style="font-size: 3.5rem; font-weight:800; margin-bottom:10px;">Connect_</h1>
                    <p style="opacity:0.4; margin-bottom:40px; letter-spacing:1px;">IDENTIFICATION BIOMÉTRIQUE GOOGLE REQUISE</p>
                    <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="onAuth"></div>
                    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill"></div>
                </div>
            </div>

            <div id="view-dash" class="view">
                <h2 style="font-size: 24px; margin-bottom: 30px; letter-spacing: -1px;">Services Autorisés</h2>
                <div class="services-grid" id="srv-grid"></div>

                <div id="admin-zone" style="display:none;">
                    <div class="admin-box">
                        <h3 style="color:var(--admin); margin-bottom:20px; font-weight:800;">⚙️ CONTRÔLE MAÎTRE (ADMIN)</h3>
                        
                        <div style="background:rgba(0,0,0,0.3); padding:20px; border-radius:15px; margin-bottom:20px;">
                            <p style="font-size:12px; margin-bottom:10px; opacity:0.6;">GÉNÉRATEUR DE TICKET CAS (BYPASS PRONOTE)</p>
                            <div style="display:flex; gap:10px;">
                                <input type="text" id="cas-mail" placeholder="julien.messai@campus-rosaparks.fr">
                                <button class="btn btn-admin" onclick="generateCAS()">LINK_ACCOUNT</button>
                            </div>
                            <div id="cas-status" style="margin-top:10px; font-size:12px;"></div>
                        </div>

                        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:10px;">
                            <input type="text" id="add-emoji" placeholder="Emoji">
                            <input type="text" id="add-name" placeholder="Nom du Service">
                            <input type="text" id="add-url" placeholder="URL">
                            <button class="btn" onclick="pushService()">PUBLIER</button>
                        </div>

                        <h3 style="margin: 30px 0 15px 0;">Flux Réseau (Logs)</h3>
                        <table class="log-table">
                            <tbody id="log-list"></tbody>
                        </table>
                    </div>
                </div>
                
                <div style="margin-top:50px; padding-top:20px; border-top:1px solid var(--border); display:flex; justify-content:space-between;">
                    <button class="btn" style="background:transparent; color:#444; border:1px solid #222;" onclick="location.reload()">TERMINER LA SESSION</button>
                    <span style="font-size:10px; opacity:0.2;">V2.0.4 - ENCRYPTED</span>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
