<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ROSA PARKS | CORE SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --glow: #00ffcc;
            --admin-color: #ff0055;
            --bg: #000000;
            --surface: #0a0a0c;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; }

        /* Interface Frame */
        .app-shell {
            height: 100vh; display: flex; flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #0d1117 0%, #000 100%);
        }

        header {
            padding: 20px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }

        .logo { font-weight: 900; letter-spacing: 2px; font-size: 1.2rem; color: var(--glow); }

        /* Views */
        .view { display: none; padding: 40px; overflow-y: auto; flex: 1; }
        .view.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Login Screen */
        .login-wrap { text-align: center; margin-top: 15vh; }
        .login-wrap h1 { font-size: 4rem; font-weight: 900; margin-bottom: 10px; line-height: 1; }
        .login-wrap p { color: #555; margin-bottom: 40px; letter-spacing: 2px; }

        /* Grid Services */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .service-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px 20px; text-align: center;
            position: relative; transition: all 0.3s; text-decoration: none; color: white;
        }
        .service-card:hover { border-color: var(--glow); transform: scale(1.02); background: rgba(0,255,204,0.02); }
        .service-card .icon { font-size: 50px; display: block; margin-bottom: 15px; }

        /* Admin Controls */
        .admin-panel {
            margin-top: 50px; padding: 40px; border-radius: 32px;
            background: rgba(255, 0, 85, 0.03); border: 1px solid rgba(255, 0, 85, 0.1);
        }
        .section-title { color: var(--admin-color); text-transform: uppercase; font-size: 12px; font-weight: 800; margin-bottom: 20px; }

        .form-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; background: #000; border: 1px solid var(--border);
            padding: 15px; border-radius: 14px; color: white; outline: none;
        }
        input:focus { border-color: var(--glow); }

        .btn {
            padding: 15px 30px; border-radius: 14px; border: none; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-add { background: #fff; color: #000; }
        .btn-cas { background: var(--admin-color); color: #fff; }
        .btn-del { position: absolute; top: 15px; right: 15px; background: none; color: #333; font-size: 20px; }
        .btn-del:hover { color: var(--admin-color); }
        .btn-logout { background: transparent; border: 1px solid #222; color: #444; }
        .btn-logout:hover { border-color: #fff; color: #fff; }

        /* Log Table */
        .logs { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 12px; }
        .logs td { padding: 12px; border-bottom: 1px solid #111; color: #666; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="logo">RP // INFRA-STRUCTURE</div>
            <div id="user-status" style="font-size: 12px; color: #444;">WAITING_AUTH</div>
        </header>

        <div id="view-login" class="view active">
            <div class="login-wrap">
                <h1>CORE<span>ACCESS</span></h1>
                <p>PROTECTED DOMAIN: @CAMPUS-ROSAPARKS.FR</p>
                <div style="display: flex; justify-content: center;">
                    <div id="g_id_onload" data-client_id="229948163418-m3n25i32ej423k59qu0gs8irp9g4vklp.apps.googleusercontent.com" data-callback="onSignIn"></div>
                    <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
                </div>
            </div>
        </div>

        <div id="view-dash" class="view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <h2 id="welcome-msg" style="font-size: 2rem; font-weight: 800;">Systems_Online</h2>
                <button class="btn btn-logout" onclick="signOut()">DISCONNECT_NODE</button>
            </div>

            <div class="grid" id="srv-grid"></div>

            <div id="admin-zone" style="display:none;" class="admin-panel">
                <div class="section-title">Root Administrator Console</div>
                
                <div style="background: rgba(0,0,0,0.4); padding: 25px; border-radius: 20px; margin-bottom: 25px;">
                    <p style="font-size: 11px; margin-bottom: 10px; color: var(--admin-color);">BYPASS_AUTH: GENERATE PRONOTE CAS TICKET</p>
                    <div class="form-row">
                        <input type="text" id="cas-mail" placeholder="Utilisateur (ex: julien.messai@campus-rosaparks.fr)">
                        <button class="btn btn-cas" onclick="bindCAS()">LIER & GÉNÉRER CAS</button>
                    </div>
                    <div id="cas-log" style="font-size: 11px; color: var(--glow);"></div>
                </div>

                <div class="section-title">Global Service Deployment</div>
                <div class="form-row">
                    <input type="text" id="add-ico" placeholder="Emoji" style="max-width: 80px;">
                    <input type="text" id="add-name" placeholder="Titre">
                    <input type="text" id="add-url" placeholder="Lien">
                    <button class="btn btn-add" onclick="createNewService()">DÉPLOYER</button>
                </div>

                <table class="logs" id="log-display"></table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
